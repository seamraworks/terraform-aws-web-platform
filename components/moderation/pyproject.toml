[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "web-platform-moderation"
version = "0.1.3"
description = "Portable conservative content moderation with OpenAI and HTTP providers"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Seamra Works"}]
readme = "README.md"
dependencies = []

[project.scripts]
web-platform-moderate = "web_platform_moderation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
